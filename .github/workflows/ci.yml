name: CI

# Checks of the interface: syntax and safety rules, translations, the manifest, the unit tests, the deterministic
# artifact, and the browser tests against the stand-in backend (sign-in, contract form, lost connection, incompatible
# backend, six languages, dark mode, phone width, axe). Every action is pinned by commit SHA (version in the comment).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run manifest:check
      - run: npm test
      - name: Build the artifact twice (deterministic)
        run: |
          npm run build -- --out "$RUNNER_TEMP/a"
          npm run build -- --out "$RUNNER_TEMP/b"
          cmp "$RUNNER_TEMP/a/nodestro-app-ui-"*.tgz "$RUNNER_TEMP/b/nodestro-app-ui-"*.tgz
          cat "$RUNNER_TEMP/a/"*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 22
        with:
          name: nodestro-app-ui
          path: ${{ runner.temp }}/a/
          retention-days: 14

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
